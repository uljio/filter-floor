[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filter-floor"
version = "0.1.0"
description = "Local, fail-closed pre-buy filter for new launchpad tokens. Verdicts: AVOID, CAUTION, PASS_FILTER."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6",
    "python-dotenv>=1",
    "web3>=6",
    "solders>=0.21",
    "solana>=0.34",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ff = "filter_floor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

base:
  chain_id: 8453
  rpc_env_key: BASE_RPC_URL
  wss_env_key: BASE_WSS_URL
  factory_addresses:
    uniswap_v3: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
    # Published Uniswap V3 NonfungiblePositionManager and SwapRouter02 on Base.
    uniswap_v3_nft_manager: "0x03a520b32C04BF3bEEf7BEb72E919cf822Ed34f1"
    uniswap_v3_swap_router: "0x2626664c2603336E57B271c5C0b26F421741e481"
    # TODO(verify): confirm Clanker factory before treating it as authoritative.
    clanker: ""
  explorer_url: https://basescan.org
  notes: >
    Clanker factory address must be verified on-chain before enable.
    Sell simulation uses eth_call with state override; if the RPC cannot
    fork/override, honeypot stays UNKNOWN (never PASS).

robinhood:
  # TODO(verify): confirm chain_id on-chain before enable. Do not invent it.
  chain_id: null
  rpc_env_key: ROBINHOOD_RPC_URL
  wss_env_key: ROBINHOOD_WSS_URL
  factory_addresses:
    # VERIFY ON-CHAIN BEFORE ENABLE. Leave empty until the Pons V2 factory
    # is confirmed on-chain. Unverified factories stay UNKNOWN, not PASS.
    pons_v2: ""
  explorer_url: ""
  notes: >
    VERIFY ON-CHAIN BEFORE ENABLE. ROBINHOOD_ENABLED default 0.
    Do not invent factory addresses. Missing facts stay UNKNOWN.
    Gate must stay off until factory addresses are filled and tested.
  enabled_env_key: ROBINHOOD_ENABLED

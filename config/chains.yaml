solana:
  chain_id: solana
  rpc_env_key: SOLANA_RPC_URL
  wss_env_key: SOLANA_WSS_URL
  factory_addresses:
    pumpfun: "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"
    # Published Raydium AMM v4 program id.
    raydium_amm_v4: "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
  explorer_url: https://solscan.io
  notes: >
    Pump.fun bonding-curve inventory at birth is a caution detail, not

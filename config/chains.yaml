robinhood:
  # TODO(verify): confirm chain_id on-chain before enable. Do not invent it.
  chain_id: null
  rpc_env_key: ROBINHOOD_RPC_URL
  wss_env_key: ROBINHOOD_WSS_URL
  factory_addresses:
    # VERIFY ON-CHAIN BEFORE ENABLE. Leave empty until the Pons V2 factory
    # is confirmed on-chain. Unverified factories stay UNKNOWN, not PASS.
    pons_v2: ""
  explorer_url: ""
  notes: >
    VERIFY ON-CHAIN BEFORE ENABLE. ROBINHOOD_ENABLED default 0.
    Do not invent factory addresses. Missing facts stay UNKNOWN.
    Gate must stay off until factory addresses are filled and tested.
  enabled_env_key: ROBINHOOD_ENABLED
